     <style>
       body{
        background-color: black;

       .container{
         display: grid;
        grid-template-columns: 50% 50%;
        width: 1150px;
        margin: 0 auto;
        gap: 50px;
       }
       .grid-item img {
         width: 100%;
       }
       
       header { 
         padding: 30px;
         margin-bottom: 10px;
      background-color: 66b3ff;
      position: sticky;
         top: 0px;
         z-index: 100;
       }
       header h1 {
         margin: 0px;

         text-align: center; 
       }
       
       h2{

       }
       
       .menu-container {
         position: absolute;
         top: 22px;
         right: 30px;
         z-index: 101;
       }
       
       .menu-button {
         background: none;
         border: none;
         cursor: pointer;
         padding: 10px;
       }
       
       .menu-button span {
         display: block;
         width: 30px;
         height: 3px;
         background-color: white;
         margin: 6px 0;
       }
       
           .dropdown-menu {
  display: none;
  background-color: #444;
}

.dropdown-menu.show {
  display: block;
}

.dropdown-menu a {
  padding-left: 30px !important;
}   
       
       #navigation {
         display: none;
         position: absolute;
         right: 0;
         top: 55px;
         background-color: #333;
         min-width: 200px;
       }
       
       #navigation.active {
  display: block;
}

#navigation ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

#navigation li {
  position: relative;
}

#navigation a {
  display: block;
  color: white;
  text-decoration: none;
  padding: 15px;
}

#navigation a:hover {
  background-color: #66b3ff;
  color: black;
}
       
     </style>
